name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      # No `version:` input — v6 errors if the version is also in package.json's
      # `packageManager`, which it is.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # 22, not 20: kept in step with ci-monorepo.yml, which explains why.
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      # v1, NOT v2. The action's major line is pinned to the Changesets CLI major:
      # v2 hard-errors on startup against the `@changesets/cli` v2 this repo installs
      # ("designed to work with Changesets CLI v3 ... use Changesets action v1
      # instead"). #363 bumped this to v2 and every Release run since failed — eight in
      # a row, one per merged dependency PR, none of them visible outside the Actions
      # tab because nothing else depends on this job. Moving to v2 means upgrading
      # `@changesets/cli` to v3 in the same change, not on its own.
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
