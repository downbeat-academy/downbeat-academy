name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

env:
  NODE_VERSION: '20.x'
  # pnpm's version is NOT set here. `pnpm/action-setup` v6 hard-errors if it finds a
  # version in both the `version:` input and `packageManager` in package.json, so
  # `packageManager: pnpm@10.34.5` is the single source of truth.
  # No job in this workflow launches a browser — E2E lives in ci-www-e2e.yml.
  # Skipping the binary download keeps installs fast across every job.
  CYPRESS_INSTALL_BINARY: '0'

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 'Lint, Typecheck & Test'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # NOTE: `pnpm format:check` is deliberately NOT gated here yet — 1063 files in the
      # repo currently fail it. Formatting them is a single mechanical commit that should
      # land on its own and be added to .git-blame-ignore-revs; gating before that happens
      # would just mean a permanently red pipeline. Add this step back afterwards.

      - name: Lint
        run: pnpm run lint

      # Typecheck and test both declare `dependsOn: ["^build"]` in turbo.json,
      # so Turbo builds cadence-tokens/icons/core first without a separate step.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  coverage:
    name: 'www Coverage'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # continue-on-error sits on the STEP, not the job: at job level the check still
      # renders red in the PR list, which trains everyone to ignore red. apps/www is at
      # 72.5% lines / 68.8% branches against thresholds of 80/75 — a pre-existing gap,
      # not a regression. The numbers stay in this step's log and the HTML report is
      # still uploaded below. Remove this once the thresholds are actually met; do not
      # lower the thresholds to match reality.
      - name: Run unit tests with coverage
        run: pnpm --filter www test:coverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: www-unit-coverage
          path: apps/www/coverage
