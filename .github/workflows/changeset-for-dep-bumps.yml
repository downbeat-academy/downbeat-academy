name: Changeset for dependency bumps

# Dependency bumps to a workspace manifest never reach a release.
#
# release.yml runs `changesets/action` on push to main, which only opens a "Version
# Packages" PR from the `.changeset/*.md` files it finds. Dependabot does not write
# changesets, so a bump to a workspace's dependencies produces no version bump and no
# changelog entry — a6992a18 changed 12 lines of cadence-core's manifest and added
# nothing to `.changeset/`. Every workspace here is changesets-managed, so this applies
# across the board, not just to the packages published to npm.
#
# This workflow closes that gap by writing the trivial patch changeset Dependabot would
# have written if it knew about changesets.
#
# WHY POST-MERGE, NOT ON THE PR: adding a commit to a Dependabot branch makes Dependabot
# stop rebasing that PR, which is exactly the behaviour we rely on to resolve
# pnpm-lock.yaml conflicts. Reacting after the merge leaves Dependabot's branches
# untouched.

on:
  push:
    branches:
      - main

# WHY A PULL REQUEST, NOT A PUSH TO MAIN: `main` requires that changes arrive through
# a pull request, so a direct push is rejected with GH006 no matter who makes it. The
# first version of this workflow pushed to main and failed on every bump that touched a
# manifest — the only case it exists for — silently dropping the changeset. Delivery is
# therefore a PR against a single standing branch, so repeated bumps accumulate into one
# open PR rather than one PR each.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changeset-for-dep-bumps
  cancel-in-progress: false

jobs:
  generate:
    name: Generate changeset
    runs-on: ubuntu-latest

    # Never react to our own commit, or we would push in a loop.
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v7
        with:
          # changesets/action needs history; we also diff against the previous head.
          fetch-depth: 0

      - name: Generate changeset for dependency bumps
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: chore/dependency-changesets
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # A branch's first push reports an all-zero "before"; fall back to the first
          # parent so the diff is still meaningful.
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || echo '')"
          fi
          if [ -z "${BEFORE}" ]; then
            echo "No usable base commit; nothing to do."
            exit 0
          fi

          # Only react to Dependabot's work. Both merge-commit and squash styles are in
          # use in this repo, so check authorship across the range and the subject lines.
          authors="$(git log --format='%an|%ae' "${BEFORE}..${AFTER}")"
          subjects="$(git log --format='%s' "${BEFORE}..${AFTER}")"
          if ! grep -qi 'dependabot' <<<"${authors}${subjects}"; then
            echo "No Dependabot commits in ${BEFORE}..${AFTER}; nothing to do."
            exit 0
          fi

          changed="$(git diff --name-only "${BEFORE}..${AFTER}")"

          # If a changeset already rode in with the merge, respect it and stay out of
          # the way.
          if grep -qE '^\.changeset/.+\.md$' <<<"${changed}"; then
            echo "Push already contains a changeset; nothing to do."
            exit 0
          fi

          # Map each changed workspace manifest to its package name. Only manifests
          # count: a lockfile-only bump changes nothing a consumer can observe, which is
          # precisely what versioning-strategy `increase-if-necessary` is meant to
          # produce for routine patches.
          names=''
          while IFS= read -r manifest; do
            case "${manifest}" in
              apps/*/package.json|packages/*/package.json) ;;
              *) continue ;;
            esac
            [ -f "${manifest}" ] || continue
            name="$(node -p "require('./${manifest}').name || ''")"
            [ -n "${name}" ] && names="${names}${name}"$'\n'
          done <<<"${changed}"

          names="$(printf '%s' "${names}" | sed '/^$/d' | sort -u)"

          if [ -z "${names}" ]; then
            echo "No workspace manifests changed; nothing to do."
            exit 0
          fi

          short="$(git rev-parse --short "${AFTER}")"
          file=".changeset/deps-${short}.md"
          {
            echo '---'
            while IFS= read -r n; do
              echo "'${n}': patch"
            done <<<"${names}"
            echo '---'
            echo
            echo "Update dependencies."
          } > "${file}"

          echo "Wrote ${file}:"
          cat "${file}"

          # Hold the changeset outside the work tree; switching branches below must not
          # depend on how git happens to treat an untracked file.
          staging="$(mktemp -d)"
          cp "${file}" "${staging}/"
          rm "${file}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Append to the branch if it exists, otherwise start it from main. It is never
          # rebased: every commit on it only ADDS a sha-named file, so its diff against
          # main stays limited to changeset additions however old its base gets, and a
          # plain fast-forward push always succeeds. Rebasing would buy nothing and could
          # strand already-accumulated changesets.
          git fetch origin main
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            git checkout -B "${BRANCH}" origin/main
          fi

          mkdir -p .changeset
          cp "${staging}/$(basename "${file}")" "${file}"
          git add "${file}"
          git commit -m "chore: add changeset for dependency bump ${short}"

          git push origin "${BRANCH}"

          if [ -z "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title 'chore: changesets for dependency bumps' \
              --body 'Changesets for Dependabot bumps that touched a workspace manifest, which Dependabot does not write itself. Generated by `.github/workflows/changeset-for-dep-bumps.yml`; each commit corresponds to one merged bump. Merge to let the release workflow version the affected packages.' \
              --label dependencies
          else
            echo "PR for ${BRANCH} is already open; the changeset was added to it."
          fi
