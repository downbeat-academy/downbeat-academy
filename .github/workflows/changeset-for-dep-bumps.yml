name: Changeset for dependency bumps

# Dependency bumps to a workspace manifest never reach a release.
#
# release.yml runs `changesets/action` on push to main, which only opens a "Version
# Packages" PR from the `.changeset/*.md` files it finds. Dependabot does not write
# changesets, so a bump to a workspace's dependencies produces no version bump and no
# changelog entry — a6992a18 changed 12 lines of cadence-core's manifest and added
# nothing to `.changeset/`. Every workspace here is changesets-managed, so this applies
# across the board, not just to the packages published to npm.
#
# This workflow closes that gap by writing the trivial patch changeset Dependabot would
# have written if it knew about changesets.
#
# WHY POST-MERGE, NOT ON THE PR: adding a commit to a Dependabot branch makes Dependabot
# stop rebasing that PR, which is exactly the behaviour we rely on to resolve
# pnpm-lock.yaml conflicts. Reacting after the merge leaves Dependabot's branches
# untouched.

on:
  push:
    branches:
      - main

# Needed to push the generated changeset back to main.
permissions:
  contents: write

concurrency:
  group: changeset-for-dep-bumps
  cancel-in-progress: false

jobs:
  generate:
    name: Generate changeset
    runs-on: ubuntu-latest

    # Never react to our own commit, or we would push in a loop.
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v7
        with:
          # changesets/action needs history; we also diff against the previous head.
          fetch-depth: 0

      - name: Generate changeset for dependency bumps
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # A branch's first push reports an all-zero "before"; fall back to the first
          # parent so the diff is still meaningful.
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || echo '')"
          fi
          if [ -z "${BEFORE}" ]; then
            echo "No usable base commit; nothing to do."
            exit 0
          fi

          # Only react to Dependabot's work. Both merge-commit and squash styles are in
          # use in this repo, so check authorship across the range and the subject lines.
          authors="$(git log --format='%an|%ae' "${BEFORE}..${AFTER}")"
          subjects="$(git log --format='%s' "${BEFORE}..${AFTER}")"
          if ! grep -qi 'dependabot' <<<"${authors}${subjects}"; then
            echo "No Dependabot commits in ${BEFORE}..${AFTER}; nothing to do."
            exit 0
          fi

          changed="$(git diff --name-only "${BEFORE}..${AFTER}")"

          # If a changeset already rode in with the merge, respect it and stay out of
          # the way.
          if grep -qE '^\.changeset/.+\.md$' <<<"${changed}"; then
            echo "Push already contains a changeset; nothing to do."
            exit 0
          fi

          # Map each changed workspace manifest to its package name. Only manifests
          # count: a lockfile-only bump changes nothing a consumer can observe, which is
          # precisely what versioning-strategy `increase-if-necessary` is meant to
          # produce for routine patches.
          names=''
          while IFS= read -r manifest; do
            case "${manifest}" in
              apps/*/package.json|packages/*/package.json) ;;
              *) continue ;;
            esac
            [ -f "${manifest}" ] || continue
            name="$(node -p "require('./${manifest}').name || ''")"
            [ -n "${name}" ] && names="${names}${name}"$'\n'
          done <<<"${changed}"

          names="$(printf '%s' "${names}" | sed '/^$/d' | sort -u)"

          if [ -z "${names}" ]; then
            echo "No workspace manifests changed; nothing to do."
            exit 0
          fi

          short="$(git rev-parse --short "${AFTER}")"
          file=".changeset/deps-${short}.md"
          {
            echo '---'
            while IFS= read -r n; do
              echo "'${n}': patch"
            done <<<"${names}"
            echo '---'
            echo
            echo "Update dependencies."
          } > "${file}"

          echo "Wrote ${file}:"
          cat "${file}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${file}"
          git commit -m "chore: add changeset for dependency bump ${short}"

          # main may have moved while this ran. The changeset is a new file with a
          # sha-derived name, so a rebase can never conflict — retry rather than fail
          # and silently lose the changeset.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main
          done

          echo "Could not push the changeset after 3 attempts." >&2
          exit 1
