name: Browser Tests - cadence-core

# Browser-mode vitest for `cadence-core`, in its own workflow rather than a job in
# `ci-monorepo.yml`.
#
# That file's env block states that no job in it launches a browser, and sets
# `CYPRESS_INSTALL_BINARY: '0'` on that basis to keep every install fast. Adding a
# Playwright job there would make the comment false and slow the shared setup down for
# jobs that gain nothing from it. `ci-www-e2e.yml` already established the separate-
# workflow pattern for browser work; this follows it, and gets path filtering for free.
#
# What runs here cannot run anywhere else: jsdom does not implement `HTMLDialogElement`,
# so focus trapping, `Escape`, the top layer and background inerting are unverifiable in
# the default project. Phase C reuses this workflow for CSS anchor positioning, which
# jsdom equally cannot compute.
#
# It runs Chromium, WebKit and Firefox. One engine cannot verify a multi-engine support
# floor, and Chromium is the engine least likely to disagree about anything.

on:
  pull_request:
    paths:
      - 'packages/cadence-**/**'
      - '.github/workflows/ci-cadence-browser.yml'
      - 'pnpm-lock.yaml'
      # The root manifest carries the `browserslist` key. A change to the support floor
      # changes the compiled CSS these tests run against, so it has to trigger them.
      - 'package.json'

  push:
    branches: [main]
    paths:
      - 'packages/cadence-**/**'
      - '.github/workflows/ci-cadence-browser.yml'
      - 'package.json'

  workflow_dispatch:

env:
  # Kept in step with ci-monorepo.yml, which explains why this is 22.x and not 20.x.
  NODE_VERSION: '22.x'
  # pnpm's version is NOT set here. `pnpm/action-setup` v6 hard-errors if it finds a
  # version in both the `version:` input and `packageManager` in package.json, so
  # `packageManager: pnpm@10.34.5` is the single source of truth.

concurrency:
  group: cadence-browser-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: 'cadence-core Browser Tests'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Key the browser cache on the resolved Playwright version, not on the lockfile
      # hash — otherwise every unrelated dependency bump re-downloads Chromium.
      - name: Resolve Playwright version
        id: playwright
        working-directory: packages/cadence-core
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # The browser set is part of the key, not just the Playwright version. Without
          # it, adding an engine hits the cache entry written when only Chromium was
          # installed, the download step is skipped as a cache hit, and the run fails with
          # "Executable doesn't exist" for the new browser. Change this list and the key
          # changes with it.
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium-webkit-firefox

      # Three engines, matching the multi-engine support floor in
      # docs/adr/0003-browser-support-floor.md. WebKit is the one that earns its cost: it
      # has no CSS anchor positioning below Safari 26, and its Tab order skips buttons, so
      # it is where progressive-enhancement fallbacks are actually exercised. Chromium
      # alone agrees with everything and proves the least.
      - name: Install browsers and their system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter cadence-core exec playwright install --with-deps chromium webkit firefox

      # The apt libraries the browsers need live outside ~/.cache/ms-playwright, so a cache
      # hit restores the browsers but not the system packages they link against. Install
      # those separately rather than paying for the whole download again.
      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter cadence-core exec playwright install-deps chromium webkit firefox

      # Through turbo rather than `pnpm --filter … test:browser`, so the `test:browser`
      # task's `dependsOn: ["^build"]` builds cadence-tokens and cadence-icons first.
      - name: Browser tests
        run: pnpm exec turbo run test:browser --filter=cadence-core
