packages:
    - 'apps/*'
    - 'packages/*'
    - 'packages/email/.react-email'

# Dependency install scripts are blocked by default from pnpm 10 onward. Only packages
# listed here may run preinstall/install/postinstall.
#
# Blocking these closes the postinstall vector that most npm supply-chain attacks rely
# on — the payload runs during `pnpm install`, before any test executes, so CI passing is
# not a defence against it.
#
# Nine scripts in the tree are blocked, and cypress is the only one that needs an
# exception. Verified by a clean `pnpm install --frozen-lockfile` on pnpm 10.34.5
# followed by a full lint/typecheck/test, build, and browser-test run, all of which pass
# with the other eight blocked:
#
#   cypress          ALLOWED — downloads its test-runner binary, and has no other route
#                    to it. Without this entry the E2E suite cannot run.
#   esbuild          blocked — its install.js only verifies a binary that already
#   @sentry/cli      arrives via platform-specific OPTIONAL DEPENDENCIES
#   unrs-resolver    (@sentry/cli-linux-x64, esbuild-linux-64, and so on). The script is
#   @parcel/watcher  a fallback downloader, so blocking it costs nothing.
#   core-js          blocked — the script only prints a funding message.
#   gl               blocked — a native gyp build, but it is an OPTIONAL dependency of
#                    opensheetmusicdisplay and only backs OSMD's Node-side canvas
#                    rendering. www renders in the browser and does not reach it.
#
# That optional-dependency pattern is what makes this safe, so it is the thing to check
# before adding an entry: confirm the package has no other route to its binary, rather
# than that it merely has a script. Do NOT use dangerouslyAllowAllBuilds to silence a
# warning.
#
# CI already sets CYPRESS_INSTALL_BINARY=0 in ci-monorepo.yml and ci-cadence-browser.yml,
# so the cypress entry mainly matters for local installs.
onlyBuiltDependencies:
    - cypress

# Refuse to resolve any version published less than 7 days ago. Malicious releases are
# usually caught and yanked within hours, so the delay filters out smash-and-grab
# compromises before they ever reach the lockfile.
#
# This is enforced at install time, so unlike Dependabot's cooldown it protects every
# install — including a developer running `pnpm add` locally — not just bot PRs.
#
# Not strict: pnpm falls back to the newest version that satisfies the age requirement
# rather than failing the install. To take a fresh release deliberately, add it to
# minimumReleaseAgeExclude rather than lowering this globally.
minimumReleaseAge: 10080
